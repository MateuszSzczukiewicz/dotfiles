"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
$username$hostname$directory$git_branch$git_status$rust$golang$nodejs$python$cmd_duration$line_break$character"""

add_newline = true

[character]
success_symbol = '[](bold green)❯'
error_symbol = '[](bold red)❯'
vimcmd_symbol = '[](bold green)❮'

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"
read_only = " "

[git_branch]
symbol = ""
style = "bold purple"
format = '[$symbol$branch(:$remote_branch) ]($style)'

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind ]($style))'

[cmd_duration]
min_time = 500
format = 'took [$duration]($style) '
style = "bold yellow"

[rust]
symbol = " "
style = "bold red"
format = '[$symbol($version )]($style)'

[golang]
symbol = " "
style = "bold blue"

[nodejs]
symbol = " "
style = "bold green"

[python]
symbol = " "
style = "bold yellow"
format = '[$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'

[username]
style_user = "bold yellow"
style_root = "bold red"
format = '[$user]($style) '
show_always = false

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = "bold green"

[package]
disabled = true

