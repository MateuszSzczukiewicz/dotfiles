config_version = 14

[bar.default]
layer = "overlay"
reserve_space = false
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 196.0
    box_width = 0.0
    cx = 0.0
    cy = 0.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

[shell]

    [shell.panel]
    borders = false
    shadow = false

[theme]
builtin = "Tokyo-Night"
community_palette = "One"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = [
    "alacritty",
    "btop",
    "cava",
    "emacs",
    "foot",
    "gtk3",
    "gtk4",
    "ghostty",
    "helix",
    "hyprland",
    "kcolorscheme",
    "kitty",
    "labwc",
    "mango",
    "niri",
    "qt",
    "scroll",
    "starship",
    "sway",
    "umbriel",
    "wezterm"
]

[wallpaper.default]
path = "/home/cti-308/backgrounds/creotech.jpg"

[wallpaper.last]
path = "/home/cti-308/backgrounds/creotech.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/cti-308/backgrounds/creotech.jpg"